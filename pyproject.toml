[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-optimization-agent"
version = "3.0.0"
description = "A production-grade prompt optimization and reliability engine that transforms raw ideas into structured, validated, and enterprise-ready AI instructions"
authors = [{name = "Your Name"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    "streamlit>=1.28.0",
    "python-dotenv>=1.0.0",
    "python-decouple>=3.8",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
prompt-optimization-cli = "prompt_optimization_agent.cli:main"
prompt-optimization-ui = "prompt_optimization_agent.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 110
indent-width = 4

# Assume Python 3.8
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# error codes (`E111`, etc.) by default.
select = ["E4", "E7", "E9", "F", "I", "UP", "N", "S", "C4", "ARG", "PTH"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
python_classes = ["Test*", "!TestCaseGenerator"]
testpaths = ["tests"]
pythonpath = ["."]
